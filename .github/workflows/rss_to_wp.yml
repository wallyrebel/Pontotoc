name: RSS to WordPress Automation

on:
  schedule:
    # Every two hours, away from the top of the hour. Times are UTC.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Evaluate stories without writing to WordPress or publication history'
        default: true
        type: boolean
      replay:
        description: 'Re-evaluate recent sources (dry run only)'
        default: false
        type: boolean
      single_feed:
        description: 'Optional exact feed name from feeds.yaml'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pontotoc-wordpress-publisher
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Restore publication history
        uses: actions/cache/restore@v6
        with:
          path: data/processed.db
          key: pontotoc-published-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pontotoc-published-v2-
            processed-db-
      - name: Evaluate and publish qualifying stories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A visible repository variable can override the editorial model.
          OPENAI_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-4.1' }}
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          TIMEZONE: America/Chicago
          LOG_LEVEL: INFO
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          REPLAY: ${{ inputs.replay || 'false' }}
          SINGLE_FEED: ${{ inputs.single_feed }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--config feeds.yaml --hours 72)
          # Never publish from an experimental branch.
          if [[ "$DRY_RUN" == 'true' || "$IS_DEFAULT_BRANCH" != 'true' ]]; then
            args+=(--dry-run)
          fi
          if [[ "$REPLAY" == 'true' ]]; then args+=(--replay); fi
          if [[ -n "$SINGLE_FEED" ]]; then args+=(--single-feed "$SINGLE_FEED"); fi
          python -m rss_to_wp run "${args[@]}"
      - name: Save publication history even after partial failure
        if: ${{ always() && github.ref_name == github.event.repository.default_branch && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && hashFiles('data/processed.db') != '' }}
        uses: actions/cache/save@v6
        with:
          path: data/processed.db
          key: pontotoc-published-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Editorial summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/editorial-summary.md ]]; then
            cat data/editorial-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Editorial run did not complete. Inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep editorial decisions for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editorial-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/editorial-report.json
            data/editorial-summary.md
          retention-days: 14
          if-no-files-found: warn
