name: Correct published Oxford donor center address
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the correction to published post 6496
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pontotoc-wordpress-publication
  cancel-in-progress: false
jobs:
  correct:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow pyyaml
      - name: Check the fixed correction and verify the existing public URL
        env:
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python scripts/correct_oxford_donor_address.py "${args[@]}"
